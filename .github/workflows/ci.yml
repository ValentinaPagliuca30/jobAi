name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint + typecheck + test + audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests + structural eval (vitest, no API calls)
        run: npm test

      # Production-dep audit only. Dev deps (vitest, tsx, dotenv, eslint) can have
      # moderate CVEs without changing the deployed bundle. Fails the build on
      # high+ severity in anything that ships to users.
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
